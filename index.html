<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARVULI</title>
    <meta http-equiv="refresh" content="0; url=frontend/src/dashboard/dashboard.html" />
    <style>
      :root {
        --primary: #8b0000;
        --bg: #f4f6f9;
        --text: #333333;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .box {
        text-align: center;
        padding: 32px 24px;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        color: var(--primary);
        font-size: 2rem;
      }

      p {
        margin: 0;
        font-size: 1rem;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>PARVULI</h1>
      <p>Redirecionando para o dashboard...</p>
      <p><a href="frontend/src/dashboard/dashboard.html">Clique aqui se não for redirecionado</a></p>
    </div>
  </body>
</html>
