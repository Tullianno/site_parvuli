<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiais e Documentos - PARVULI</title>
<style>
:root{--bg:#f4f6f9;--primary:#8b0000;--muted:#777}*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}body{margin:0;background:var(--bg);color:#333;padding-bottom:80px}header{background:var(--primary);color:#fff;padding:20px;text-align:center;border-radius:0 0 15px 15px}main{padding:15px}.intro,.documento{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 2px 5px #0000000d}.intro h2{margin:0 0 5px;font-size:1.1rem}.intro p{margin:0;color:var(--muted);font-size:.9rem}.cabecalho-lista{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.cabecalho-lista h2{margin:0;font-size:1rem;color:#555}.documento{display:flex;align-items:center;gap:12px}.documento-icone{font-size:1.8rem}.documento-info{flex:1}.documento-info strong,.documento-info span{display:block}.documento-info span{color:var(--muted);font-size:.82rem;margin-top:3px}.btn{border:0;border-radius:7px;padding:9px 12px;cursor:pointer;text-decoration:none;font-weight:bold;background:var(--primary);color:#fff}.btn-secundario{background:#f0f0f0;color:var(--primary)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}.modal-content{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow:auto;position:relative}.fechar{position:absolute;top:10px;right:14px;border:0;background:transparent;font-size:1.5rem;cursor:pointer}.conteudo-documento{white-space:pre-line;line-height:1.5;color:#555;margin-top:15px}.form-grupo{margin-bottom:13px}.form-grupo label{display:block;font-weight:bold;margin-bottom:5px;font-size:.9rem}.form-grupo input,.form-grupo textarea{width:100%;border:1px solid #ccc;border-radius:7px;padding:10px;font-size:1rem}.form-grupo textarea{min-height:130px;resize:vertical}.ajuda{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}.vazio{text-align:center;color:var(--muted);padding:20px}.bottom-nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 10px #0000001a}.nav-item{color:var(--muted);text-decoration:none;font-size:.8rem}
</style></head>
<body>
<header><h1>Materiais e Documentos</h1></header>
<main><section class="intro"><h2>Biblioteca do grupo</h2><p>Todos podem consultar. Administração e coordenação podem adicionar e editar documentos.</p></section><div class="cabecalho-lista"><h2>Documentos disponíveis</h2><button class="btn" id="btn-adicionar" onclick="abrirFormularioDocumento()">+ Adicionar documento</button></div><section id="lista-documentos"></section></main>
<div class="modal" id="modal-documento" onclick="fecharAoClicarFora(event)"><div class="modal-content"><button class="fechar" onclick="fecharDocumento()">&times;</button><h2 id="titulo-documento"></h2><div class="conteudo-documento" id="conteudo-documento"></div></div></div>
<div class="modal" id="modal-formulario" onclick="fecharFormularioAoClicarFora(event)"><div class="modal-content"><button class="fechar" onclick="fecharFormularioDocumento()">&times;</button><h2 id="titulo-formulario">Adicionar documento</h2><form onsubmit="salvarDocumento(event)"><div class="form-grupo"><label for="nome-documento">Nome</label><input id="nome-documento" required maxlength="100" placeholder="Ex.: Manual dos servidores"></div><div class="form-grupo"><label for="texto-documento">Texto do documento</label><textarea id="texto-documento" placeholder="Escreva o conteúdo ou uma descrição"></textarea></div><div class="form-grupo"><label for="arquivo-documento">Ou envie um arquivo</label><input id="arquivo-documento" type="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.ppt,.pptx,.odp,.txt,.doc,.docx,.xls,.xlsx,.csv,.odt,.ods"><span class="ajuda">PDF, imagens, slides, TXT, documentos e planilhas.</span></div><button class="btn" type="submit">Salvar documento</button></form></div></div>
<nav class="bottom-nav"><a href="../dashboard/dashboard.html" class="nav-item">Início</a><a href="../ver_escala/ver_escala.html" class="nav-item">Escalas</a><a href="../perfil/perfil.html" class="nav-item">Perfil</a></nav>
<script>
const perfilUsuario='administracao'; // 'administracao', 'coordenacao' ou 'consulta'
const podeEditar=perfilUsuario==='administracao'||perfilUsuario==='coordenacao';
const documentosIniciais=[{id:1,nome:'Manual dos servidores',tipo:'PDF',atualizado:'10/10/2026',texto:'Manual dos servidores do grupo.'},{id:2,nome:'Roteiro da missa solene',tipo:'Documento',atualizado:'08/10/2026',texto:'Roteiro e orientações para a missa solene.'},{id:3,nome:'Escala de funções',tipo:'Planilha',atualizado:'01/10/2026',texto:'Lista de funções e responsabilidades.'}];
let documentos=JSON.parse(localStorage.getItem('parvuli_documentos')||'null')||documentosIniciais;let documentoEditando=null;
function escaparHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function renderizarDocumentos(){const c=document.getElementById('lista-documentos');c.innerHTML=documentos.length?documentos.map(d=>`<article class="documento"><div class="documento-icone">📄</div><div class="documento-info"><strong>${escaparHTML(d.nome)}</strong><span>${escaparHTML(d.tipo||'Arquivo')} · Atualizado em ${d.atualizado}</span></div><button class="btn" onclick="abrirDocumento(${d.id})">Abrir</button>${podeEditar?`<button class="btn btn-secundario" onclick="editarDocumento(${d.id})">Editar</button>`:''}</article>`).join(''):'<div class="vazio">Nenhum documento disponível.</div>';document.getElementById('btn-adicionar').style.display=podeEditar?'block':'none'}
function abrirDocumento(id){const d=documentos.find(x=>x.id===id);if(!d)return;document.getElementById('titulo-documento').innerText=d.nome;const a=document.getElementById('conteudo-documento');a.innerHTML='';if(d.arquivoData){const l=document.createElement('a');l.href=d.arquivoData;l.download=d.arquivoNome||d.nome;l.className='btn';l.innerText='Baixar arquivo';a.appendChild(l)}if(d.texto){const p=document.createElement('p');p.innerText=d.texto;a.appendChild(p)}document.getElementById('modal-documento').style.display='flex'}
function fecharDocumento(){document.getElementById('modal-documento').style.display='none'}function fecharAoClicarFora(e){if(e.target.id==='modal-documento')fecharDocumento()}
function abrirFormularioDocumento(id=null){if(!podeEditar)return;documentoEditando=id;const d=documentos.find(x=>x.id===id);document.getElementById('titulo-formulario').innerText=d?'Editar documento':'Adicionar documento';document.getElementById('nome-documento').value=d?.nome||'';document.getElementById('texto-documento').value=d?.texto||'';document.getElementById('arquivo-documento').value='';document.getElementById('modal-formulario').style.display='flex'}
function fecharFormularioDocumento(){document.getElementById('modal-formulario').style.display='none';documentoEditando=null}function fecharFormularioAoClicarFora(e){if(e.target.id==='modal-formulario')fecharFormularioDocumento()}function editarDocumento(id){abrirFormularioDocumento(id)}
function salvarDocumento(e){e.preventDefault();if(!podeEditar)return;const nome=document.getElementById('nome-documento').value.trim(),texto=document.getElementById('texto-documento').value.trim(),arquivo=document.getElementById('arquivo-documento').files[0];if(!texto&&!arquivo&&!documentoEditando){alert('Informe um texto ou selecione um arquivo.');return}const concluir=data=>{const existente=documentoEditando?documentos.find(x=>x.id===documentoEditando):null;const d=existente||{id:Date.now()};d.nome=nome;d.tipo=arquivo?arquivo.type||'Arquivo':'Texto';d.atualizado=new Date().toLocaleDateString('pt-BR');if(texto)d.texto=texto;if(data){d.arquivoData=data;d.arquivoNome=arquivo.name}documentos=existente?documentos.map(x=>x.id===d.id?d:x):[...documentos,d];localStorage.setItem('parvuli_documentos',JSON.stringify(documentos));renderizarDocumentos();fecharFormularioDocumento();alert('Documento salvo com sucesso.')};if(arquivo){const r=new FileReader();r.onload=()=>concluir(r.result);r.readAsDataURL(arquivo)}else concluir(null)}
renderizarDocumentos();
</script></body></html>
