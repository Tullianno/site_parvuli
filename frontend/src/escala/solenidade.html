<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala Solene - PARVULI</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --primary: #8b0000;
            --border-color: #000;
            --card-bg: #ffffff;
            --accent-solene: #fff3cd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); padding: 15px; padding-bottom: 80px; }

        .header-nav { display: flex; align-items: center; margin-bottom: 15px; }
        .btn-voltar { text-decoration: none; font-size: 1.1rem; font-weight: bold; color: var(--primary); background: var(--card-bg); padding: 8px 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .escala-container { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Cabeçalho da Solenidade */
        .solene-topo { border: 2px dashed var(--primary); background-color: var(--accent-solene); padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .solene-topo h2 { font-size: 1.2rem; text-transform: uppercase; margin-bottom: 5px; color: #856404; }
        .solene-topo p { font-size: 1rem; font-weight: bold; }

        /* Tabela da Solenidade */
        table { width: 100%; border-collapse: collapse; border: 2px solid var(--border-color); }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; vertical-align: middle; font-size: 0.95rem; }
        th { background-color: #f0f0f0; text-align: center; }
        
        .coluna-funcao { width: 40%; font-weight: bold; background-color: #fafafa; }
        .coluna-nomes { width: 60%; }

        .select-membro { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 5px; font-size: 0.9rem; }
        .select-membro:last-child { margin-bottom: 0; }

        /* Painel de Adicionar Funções Opcionais */
        .painel-adicionais { margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
        .painel-adicionais h3 { font-size: 1rem; margin-bottom: 10px; }
        .botoes-adicionais { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-add { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-add:hover { background: #218838; }

        .btn-remover-funcao { background: #dc3545; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 0.75rem; float: right; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="escala.html" class="btn-voltar">← Voltar à Escala Mensal</a>
    </div>

    <main class="escala-container">
        
        <div class="solene-topo">
            <h2 id="liturgia-texto">18º Domingo do Tempo Comum</h2>
            <p id="data-hora-texto">Domingo (06/09) - 10:00</p>
        </div>

        <table id="tabela-solene">
            <thead>
                <tr>
                    <th>Função</th>
                    <th>Nomes</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-solene">
                <!-- Funções Fixas inseridas via JS -->
            </tbody>
        </table>

        <!-- Painel para adicionar funções extras -->
        <div class="painel-adicionais">
            <h3>Adicionar Funções Especiais</h3>
            <div class="botoes-adicionais">
                <button class="btn-add" onclick="adicionarFuncaoOpcional('Missal', 1)">+ Missal</button>
                <button class="btn-add" onclick="adicionarMitraBaculo()">+ Mitra e Báculo</button>
                <button class="btn-add" onclick="adicionarFuncaoOpcional('Palio', 4)">+ Pálio (4 pessoas)</button>
                <button class="btn-add" onclick="adicionarFuncaoOpcional('Apoio', 1, true)">+ Apoio (Livre)</button>
            </div>
        </div>

    </main>

    <script>
        // Banco simulado de membros com suas respectivas funções reais no grupo
        const membrosGeral = [
            { id: 1, nome: "Túlio Rocha", funcaoGrupo: "Cerimoniário Mor" },
            { id: 2, nome: "Pedro Alves", funcaoGrupo: "Cerimoniário Mor" },
            { id: 3, nome: "Gigi", funcaoGrupo: "Acólito" },
            { id: 4, nome: "João Pedro", funcaoGrupo: "Acólito" },
            { id: 5, nome: "Mateus", funcaoGrupo: "Acólito" }
        ];

        // Funções fixas obrigatórias da Missa Solene e quantas pessoas cada uma exige
        const funcoesFixas = [
            { nome: "Mor", qtd: 1, restritoMor: true },
            { nome: "Cruz e leituras", qtd: 1, restritoMor: false },
            { nome: "Turíbulo", qtd: 1, restritoMor: false },
            { nome: "Naveta", qtd: 1, restritoMor: false },
            { nome: "Velas", qtd: 2, restritoMor: false }
        ];

        // Rastreio de quais opcionais já foram adicionados para respeitar a regra de "somente uma vez"
        let adicionadosUnicos = [];

        window.onload = () => {
            // Pega o parâmetro da URL (ex: ?missa=2026-09-06T10:00)
            const urlParams = new URLSearchParams(window.location.search);
            const missaId = urlParams.get('missa');

            if (missaId) {
                // O missaId vem no formato "AAAA-MM-DDTHH:MM"
                const [dataParte, hora] = missaId.split('T');
                const [ano, mes, dia] = dataParte.split('-');
                
                const dataObj = new Date(ano, mes - 1, dia);
                const diaSemanaTexto = dataObj.getDay() === 0 ? "Domingo" : "Sábado";
                
                // Atualiza o texto na tela solene
                document.getElementById('data-hora-texto').innerText = `${diaSemanaTexto} (${dia}/${mes}/${ano}) - ${hora}`;
                // Futuramente aqui você pode cruzar com a API do General Roman Calendar para puxar o dia litúrgico exato
            }

            renderizarTabelaSolene();
        };

        function renderizarTabelaSolene() {
            const tbody = document.getElementById('corpo-tabela-solene');
            tbody.innerHTML = '';

            // Renderiza as fixas
            funcoesFixas.forEach(f => criarLinhaTabela(f.nome, f.qtd, f.restritoMor, false));
        }

        function criarLinhaTabela(nomeFuncao, quantidade, restritoMor, ehOpcional, idOpcional = null) {
            const tbody = document.getElementById('corpo-tabela-solene');
            const tr = document.createElement('tr');
            if (idOpcional) tr.id = idOpcional;

            // Coluna da Função
            let htmlFuncao = nomeFuncao;
            if (ehOpcional) {
                htmlFuncao += ` <button class="btn-remover-funcao" onclick="removerFuncao('${idOpcional}', '${nomeFuncao}')">Remover</button>`;
            }

            // Coluna dos Nomes (Gera quantidade exata de selects exigidos pela regra)
            let htmlSelects = '';
            for (let i = 0; i < quantidade; i++) {
                htmlSelects += gerarSelectMembros(restritoMor);
            }

            tr.innerHTML = `
                <td class="coluna-funcao">${htmlFuncao}</td>
                <td class="coluna-nomes">${htmlSelects}</td>
            `;
            tbody.appendChild(tr);
        }

        function gerarSelectMembros(apenasCerimoniarioMor) {
            let options = '<option value="">Selecione o membro...</option>';
            
            membrosGeral.forEach(m => {
                // Se a função for "Mor", filtra apenas quem é Cerimoniário Mor. 
                // Caso contrário, exibe todos (já que Cerimoniários Mores também podem participar de qualquer outra função).
                if (apenasCerimoniarioMor && m.funcaoGrupo !== "Cerimoniário Mor") {
                    return; 
                }
                options += `<option value="${m.id}">${m.nome} (${m.funcaoGrupo})</option>`;
            });

            return `<select class="select-membro">${options}</select>`;
        }

        // Lógica para adicionar funções opcionais respeitando as regras
        function adicionarFuncaoOpcional(nome, qtd, ehLivre = false) {
            if (!ehLivre && adicionadosUnicos.includes(nome)) {
                alert(`A função "${nome}" só pode ser adicionada uma vez na escala solene.`);
                return;
            }
            if (!ehLivre) {
                adicionadosUnicos.push(nome);
            }

            const idUnico = 'opc_' + Date.now() + Math.random();
            criarLinhaTabela(nome, qtd, false, true, idUnico);
        }

        // Regra especial: Mitra e Báculo adicionadas em conjunto automaticamente
        function adicionarMitraBaculo() {
            if (adicionadosUnicos.includes("Mitra e Báculo")) {
                alert("As funções de Mitra e Báculo já foram adicionadas.");
                return;
            }
            adicionadosUnicos.push("Mitra e Báculo");

            const idUnico = 'opc_mitra_' + Date.now();
            criarLinhaTabela("Mitra", 1, false, true, idUnico);
            criarLinhaTabela("Báculo", 1, false, true, idUnico + '_baculo');
        }

        function removerFuncao(idLinha, nomeFuncao) {
            if (nomeFuncao === "Mitra" || nomeFuncao === "Báculo") {
                // Remove ambas se for o par
                document.getElementById(idLinha)?.remove();
                document.getElementById(idLinha + '_baculo')?.remove();
                adicionadosUnicos = adicionadosUnicos.filter(x => x !== "Mitra e Báculo");
            } else {
                document.getElementById(idLinha)?.remove();
                adicionadosUnicos = adicionadosUnicos.filter(x => x !== nomeFuncao);
            }
        }
    </script>
</body>
</html>
